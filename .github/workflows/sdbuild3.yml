name: SD Build v4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=OFF

      - name: Build
        run: |
          cmake --build build --config Release -j2

      - name: Find binaries
        run: |
          echo "=== BUILD OUTPUT ==="
          find build -type f \( -name "sd-cli" -o -name "sd-server" \) -print

      - name: Check binary architecture
        run: |
          file $(find build -type f -name "sd-cli" | head -1)

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: sd-binaries-android-arm64
          path: |
            build/bin/sd-cli
            build/bin/sd-server
          if-no-files-found: error
